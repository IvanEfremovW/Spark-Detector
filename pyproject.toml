[project]
name = "spark-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IvanEfremovW", email = "Ivan.EfremovWM@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "ultralytics>=8.4.62",
]

[project.scripts]
spark-detector = "spark_detector.main:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.46",
]
